name: Helm Chart

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint .

  push-chart:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    env:
      # The helm-push plugin reads these natively, so the credentials
      # never appear on a command line.
      HELM_REPO_USERNAME: ${{ secrets.HELM_REPO_USERNAME }}
      HELM_REPO_PASSWORD: ${{ secrets.HELM_REPO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the chart museum credentials are configured
        run: |
          if [ -z "$HELM_REPO_USERNAME" ] || [ -z "$HELM_REPO_PASSWORD" ]; then
            echo "::error::HELM_REPO_USERNAME / HELM_REPO_PASSWORD repository secrets are missing or empty, so the chart cannot be published."
            exit 1
          fi
      - name: Check whether this chart version is already published
        id: check
        run: |
          version=$(helm show chart . | awk '/^version:/ {print $2}')
          echo "Chart version: ${version}"
          if curl -sf -o /dev/null "https://charts.softonic.io/api/charts/homing-pigeon/${version}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::homing-pigeon ${version} is already published; nothing to push."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published == 'false'
        run: helm plugin install https://github.com/chartmuseum/helm-push.git
      - if: steps.check.outputs.published == 'false'
        run: helm cm-push . https://charts.softonic.io
